name: CI & Registry Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Build Monorepo
        run: pnpm build

      - name: Run Unit Tests
        run: pnpm test

      - name: Test CLI
        run: |
          node packages/cli/bin/run.js --help
          node packages/cli/bin/run.js search
          node packages/cli/bin/run.js doctor
